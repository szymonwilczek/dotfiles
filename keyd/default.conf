# keyd - HHKB-style Fn layer for my keyboard.
# Linked to /etc/keyd/default.conf by ansible (tag: keyd).
# sudo keyd reload after editing

[ids]
# GSKY Onionite 87 ANSI
342d:e40f

[global]
# Holding Tab longer than this and releasing it alone sends nothing
overload_tap_timeout = 200

[main]
# Tap: Tab
# Hold: nav layer
tab = overload(nav, tab)

[nav]
h = left
j = down
k = up
l = right
u = pageup
d = pagedown
backspace = delete
