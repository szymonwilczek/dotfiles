# Generated automatically by dotfiles/theme/apply.sh - DO NOT EDIT MANUALLY
# Edit dotfiles/theme/colors.sh instead!

# Status bar layout
set-option -g status on
set-option -g status-position bottom
set-option -g status-justify left
set-option -g status-style "bg=default,fg=#9e9e9e"

# Left status: Session name block with active border color
set-option -g status-left-length 50
set-option -g status-left "#[bg=#707070,fg=#121212,bold] #S #[bg=default,fg=default] "

# Right status: Completely empty as requested
set-option -g status-right-length 0
set-option -g status-right ""

# Window status list
set-window-option -g window-status-separator " "

# Inactive window format
set-window-option -g window-status-style "bg=#181818,fg=#6e6e6e"
set-window-option -g window-status-format "#[bg=#181818,fg=#6e6e6e] #I: #W "

# Active window format
set-window-option -g window-status-current-style "bg=#2c2c2c,fg=#b2b2b2,bold"
set-window-option -g window-status-current-format "#[bg=#2c2c2c,fg=#b2b2b2,bold] #I: #W "

# Pane borders
set-option -g pane-border-style "fg=#242424"
set-option -g pane-active-border-style "fg=#707070"

# Popup / floax / jot border colors
set -g @floax-border-color "#707070"
set -g @jot-border-color "#707070"

# Messages & command prompt
set-option -g message-style "bg=#181818,fg=#b2b2b2"
set-option -g message-command-style "bg=#181818,fg=#b2b2b2"
