################
### MONITORS ###
################

monitor = HDMI-A-1, 1920x1080@75, 0x0, 1
workspace = 1, monitor:HDMI-A-1

monitor = DP-2, 1920x1080@179.82, 1920x0, 1
workspace = 2, monitor:DP-2, default:true

monitor = DP-1, 1600x900@77, 3840x0, 1
workspace = 3, monitor:DP-1

###################
### MY PROGRAMS ###
###################

$terminal = ghostty 
$fileManager = nautilus --new-window
$menu = wofi --show drun -a


#################
### AUTOSTART ###
#################

exec-once = waybar &
exec-once = swayosd-server

exec-once = swww-daemon --format xrgb
exec-once = swww img $(cat ~/.cache/current_wallpaper) --transition-type-none

exec-once = gnome-keyring-daemon --start --components=secrets

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,20
env = HYPRCURSOR_SIZE,20


###################
### PERMISSIONS ###
###################

#####################
### LOOK AND FEEL ###
#####################

source = ~/.cache/wal/colors-hyprland.conf

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = $color2 
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 15
    rounding_power = 3 

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    bezier = cupertino, 0.16, 1, 0.3, 1
    bezier = brutal, 0, 0, 1, 1
    bezier = menuExit, 0.38, 0.04, 1, 0.07
    bezier = snappy, 0.05, 0.9, 0.1, 1

    animation = windowsIn, 1, 4, cupertino, popin 80%
    animation = windowsOut, 1, 1.2, brutal, popin 98%
    animation = windowsMove, 1, 4.5, cupertino

    animation = fadeIn, 1, 1.5, snappy
    animation = fadeOut, 1, 1.5, snappy
    animation = fadeSwitch, 1, 4, cupertino

    animation = layersIn, 1, 2.5, cupertino, popin 80% 
    animation = layersOut, 1, 1.5, menuExit, popin 70%
    animation = fadeLayersOut, 1, 1.2, menuExit

    animation = workspaces, 1, 4.5, cupertino, slidefade 15%
    animation = specialWorkspace, 1, 4.5, cupertino, slidefadevert 15%
}

# smart gaps
workspace = m[HDMI-A-1] w[tv1], gapsout:0, gapsin:0
workspace = m[HDMI-A-1] f[1], gapsout:0, gapsin:0
windowrulev2 = bordersize 0, floating:0, onworkspace:m[HDMI-A-1] w[tv1]
windowrulev2 = rounding 0, floating:0, onworkspace:m[HDMI-A-1] w[tv1]
windowrulev2 = bordersize 0, floating:0, onworkspace:m[HDMI-A-1] f[1]
windowrulev2 = rounding 0, floating:0, onworkspace:m[HDMI-A-1] f[1]

workspace = m[DP-1] w[tv1], gapsout:0, gapsin:0
workspace = m[DP-1] f[1], gapsout:0, gapsin:0
windowrulev2 = bordersize 0, floating:0, onworkspace:m[DP-1] w[tv1]
windowrulev2 = rounding 0, floating:0, onworkspace:m[DP-1] w[tv1]
windowrulev2 = bordersize 0, floating:0, onworkspace:m[DP-1] f[1]
windowrulev2 = rounding 0, floating:0, onworkspace:m[DP-1] f[1]

dwindle {
    pseudotile = true 
    preserve_split = true 
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true 
    disable_splash_rendering = true
}


#############
### INPUT ###
#############

input {
    kb_layout = pl 

    repeat_rate = 45
    repeat_delay = 150
    numlock_by_default = true

    follow_mouse = 1
    mouse_refocus = true

    sensitivity = -0.829508

    touchpad {
        natural_scroll = false
    }
}

cursor {
  no_hardware_cursors = false
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

#############
### GROUP ###
#############

group {
    insert_after_current = true
    col.border_active = $color1
    col.border_inactive = rgba(595959aa)

    groupbar {
        enabled = true
        
        font_family = SF Pro Display
        font_size = 13
        font_weight_active = semibold
        font_weight_inactive = normal
        
        text_offset = 0
        text_color = rgba(ffffffff)

        height = 30 
        
        gradients = true
        
        col.active = rgba(1e1e1ecc)      
        col.inactive = rgba(00000088)    
        
        gradient_rounding = 14
        gradient_rounding_power = 3
        gradient_round_only_edges = false
        round_only_edges = false
        
        indicator_height = 0
        indicator_gap = 0
        
        gaps_in = 5
        gaps_out = 5
    }
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, A, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Z, togglefloating,
bind = $mainMod, S, exec, pkill wofi || wofi --show drun -a
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod SHIFT, P, pin
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, X, centerwindow

# focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# resize
bind = $mainMod SHIFT, Z, submap, resize

submap = resize

binde = , right, resizeactive, 20 0
binde = , left, resizeactive, -20 0
binde = , up, resizeactive, 0 -20
binde = , down, resizeactive, 0 20

bind = , escape, submap, reset

submap = reset

# monitor swap
bind = $mainMod SHIFT, right, movetoworkspace, e+1
bind = $mainMod SHIFT, left, movetoworkspace, e-1

# current monitor window swap
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, L, swapwindow, r
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, J, swapwindow, d

# workspaces switch 
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, mouse_down, workspace, m+1
bind = $mainMod, mouse_up, workspace, m-1
bind = $mainMod SHIFT, mouse_up, workspace, r+1
bind = $mainMod SHIFT, mouse_down, workspace, r-1
bind = $mainMod SHIFT, N, workspace, empty

# moving window to workspace 
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# mimic minimazing with special workspaces 
bind = $mainMod SHIFT, minus, togglespecialworkspace, magic
bind = $mainMod SHIFT, minus, movetoworkspace, +0
bind = $mainMod SHIFT, minus, togglespecialworkspace, magic
bind = $mainMod SHIFT, minus, movetoworkspace, special:magic
bind = $mainMod SHIFT, minus, togglespecialworkspace, magic

# tab groups
bind = $mainMod, G, togglegroup
bind = $mainMod, tab, changegroupactive, f
bind = $mainMod SHIFT, tab, changegroupactive, b

# move/resize with mouse 
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# sway volume
bindel = , code:122, exec, swayosd-client --output-volume -5
bindel = , code:123, exec, swayosd-client --output-volume +5
bind = , mouse:275, exec, swayosd-client --output-volume -2
bind = , mouse:276, exec, swayosd-client --output-volume +2

# Windows-like bindings
bind = $mainMod SHIFT, S, exec, sh -c 'grim -g "$(slurp)" - | wl-copy && notify-send "📸 Zrzut ekranu" "Skopiowano do schowka"'
bind = $mainMod, period, exec, hypremoji

# wallpaper switch
bind = $mainMod SHIFT, W, exec, bash ~/.config/hypr/scripts/wallpaper_picker.sh


##############################
### WINDOWS AND WORKSPACES ###
##############################

# overall
windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
windowrulev2 = bordercolor rgb(ff4d4d) rgb(cc0000), pinned:1
windowrulev2 = float, title:^(Open File|Wybierz plik|Save File|Zapisz plik)$
windowrulev2 = center, title:^(Open File|Wybierz plik|Save File|Zapisz plik)$

# logout dialog
layerrule = blur, logout_dialog
layerrule = ignorealpha 0.2, logout_dialog

# notifications
layerrule = animation slide right, notifications
layerrule = blur, notifications
layerrule = ignorealpha 0.2, notifications

# wofi & rofi
layerrule = blur, wofi
layerrule = ignorealpha 0.5, wofi
layerrule = blur, rofi
layerrule = ignorealpha 0.0, rofi
layerrule = ignorezero, rofi
layerrule = xray 0, rofi

# waybar
layerrule = blur, waybar
layerrule = ignorealpha 0.3, waybar

# swayosd
layerrule = blur, swayosd
layerrule = ignorealpha 0.2, swayosd

# pavucontrol
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = size 700 500, class:^(pavucontrol)$
windowrulev2 = size 700 500, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = center, class:^(pavucontrol)$
windowrulev2 = center, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = pin, class:^(pavucontrol)$ 
windowrulev2 = pin, class:^(org.pulseaudio.pavucontrol)$

# emoji picker
windowrulev2 = float, title:^(HyprEmoji)$
windowrulev2 = size 450 500, title:^(HyprEmoji)$
windowrulev2 = stayfocused, title:^(HyprEmoji)$
windowrulev2 = pin, title:^(HyprEmoji)$

# gnome apps
windowrulev2 = float, class:^(org.gnome.Calendar)$
windowrulev2 = size 750 500, class:^(org.gnome.Calendar)$
windowrulev2 = center, class:^(org.gnome.Calendar)$
windowrulev2 = opacity 0.90 0.85, class:^(org.gnome.Nautilus)$
windowrulev2 = opacity 0.95 0.90, class:^(org.gnome.Calendar)$
layerrule = blur, class:^(org.gnome.Nautilus)$
layerrule = blur, class:^(org.gnome.Calendar)$
windowrulev2 = float, class:^(org.gnome.Loupe)$
windowrulev2 = center, class:^(org.gnome.Loupe)$

# applications

# GIMP
windowrulev2 = float, class:^(org.gimp.GIMP)$
windowrulev2 = size 1600 900, class:^(org.gimp.GIMP)$
windowrulev2 = center, class:^(org.gimp.GIMP)$
