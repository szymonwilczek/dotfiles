################
### MONITORS ###
################

monitor = HDMI-A-1, 1920x1080@75, 0x0, 1
workspace = 1, monitor:HDMI-A-1

monitor = DP-2, 1920x1080@179.82, 1920x0, 1
workspace = 2, monitor:DP-2, default:true

monitor = DP-1, 1600x900@77, 3840x0, 1
workspace = 3, monitor:DP-1

###################
### MY PROGRAMS ###
###################

$terminal = ghostty 
$fileManager = nautilus 
$menu = wofi --show drun -a


#################
### AUTOSTART ###
#################

exec-once = waybar &
exec-once = swayosd-server

exec-once = swww-daemon --format xrgb
exec-once = sww img $(cat ~/.cache/current_wallpaper) --transition-type-none


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,20
env = HYPRCURSOR_SIZE,20


###################
### PERMISSIONS ###
###################

#####################
### LOOK AND FEEL ###
#####################

source = ~/.cache/wal/colors-hyprland.conf

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = $color1 
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 15
    rounding_power = 3 

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    bezier = cupertino, 0.16, 1, 0.3, 1
    bezier = brutal, 0, 0, 1, 1
    bezier = menuExit, 0.38, 0.04, 1, 0.07

    animation = windowsIn, 1, 4, cupertino, popin 80%
    animation = windowsOut, 1, 1.2, brutal, popin 98%
    animation = windowsMove, 1, 4.5, cupertino

    animation = fadeIn, 1, 4, cupertino
    animation = fadeOut, 1, 0.2, brutal

    animation = layersIn, 1, 4, cupertino, popin 80% 
    animation = layersOut, 1, 1.5, menuExit, popin 70%
    animation = fadeLayersOut, 1, 1.2, menuExit

    animation = workspaces, 1, 4.5, cupertino, slidefade 15%
    animation = specialWorkspace, 1, 4.5, cupertino, slidefadevert 15%
}

# smart gaps
workspace = m[HDMI-A-1] w[tv1], gapsout:0, gapsin:0
workspace = m[HDMI-A-1] f[1], gapsout:0, gapsin:0
windowrulev2 = bordersize 0, floating:0, onworkspace:m[HDMI-A-1] w[tv1]
windowrulev2 = rounding 0, floating:0, onworkspace:m[HDMI-A-1] w[tv1]
windowrulev2 = bordersize 0, floating:0, onworkspace:m[HDMI-A-1] f[1]
windowrulev2 = rounding 0, floating:0, onworkspace:m[HDMI-A-1] f[1]

workspace = m[DP-1] w[tv1], gapsout:0, gapsin:0
workspace = m[DP-1] f[1], gapsout:0, gapsin:0
windowrulev2 = bordersize 0, floating:0, onworkspace:m[DP-1] w[tv1]
windowrulev2 = rounding 0, floating:0, onworkspace:m[DP-1] w[tv1]
windowrulev2 = bordersize 0, floating:0, onworkspace:m[DP-1] f[1]
windowrulev2 = rounding 0, floating:0, onworkspace:m[DP-1] f[1]

dwindle {
    pseudotile = true 
    preserve_split = true 
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true 
    disable_splash_rendering = true
}


#############
### INPUT ###
#############

input {
    kb_layout = pl 

    repeat_rate = 53
    repeat_delay = 150
    numlock_by_default = true

    follow_mouse = 1
    mouse_refocus = true

    sensitivity = -0.529508

    touchpad {
        natural_scroll = false
    }
}

cursor {
  no_hardware_cursors = false
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, A, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Z, togglefloating,
bind = $mainMod, S, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d


# monitor swap
bind = $mainMod SHIFT, right, movetoworkspace, e+1
bind = $mainMod SHIFT, left, movetoworkspace, e-1

# current monitor window swap
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, L, swapwindow, r
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, J, swapwindow, d

# move/resize with mouse 
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = , code:122, exec, swayosd-client --output-volume -5
bindel = , code:123, exec, swayosd-client --output-volume +5

bind = $mainMod SHIFT, S, exec, sh -c 'grim -g "$(slurp)" - | wl-copy && notify-send "📸 Zrzut ekranu" "Skopiowano do schowka"'

bind = $mainMod SHIFT, W, exec, bash ~/.config/hypr/scripts/wallpaper_picker.sh

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = size 700 500, class:^(pavucontrol)$
windowrulev2 = size 700 500, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = center, class:^(pavucontrol)$
windowrulev2 = center, class:^(org.pulseaudio.pavucontrol)$
windowrulev2 = pin, class:^(pavucontrol)$ 
windowrulev2 = pin, class:^(org.pulseaudio.pavucontrol)$

windowrulev2 = float, class:^(org.gnome.Calendar)$
windowrulev2 = size 750 500, class:^(org.gnome.Calendar)$
windowrulev2 = center, class:^(org.gnome.Calendar)$

layerrule = blur, logout_dialog
layerrule = ignorealpha 0.2, logout_dialog

layerrule = animation slide right, notifications
layerrule = blur, notifications
layerrule = ignorealpha 0.2, notifications

layerrule = blur, wofi
layerrule = ignorealpha 0.5, wofi

layerrule = blur, rofi
layerrule = ignorealpha 0.0, rofi
layerrule = ignorezero, rofi
layerrule = xray 0, rofi

layerrule = blur, waybar
layerrule = ignorealpha 0.3, waybar

layerrule = blur, swayosd
layerrule = ignorealpha 0.2, swayosd

windowrulev2 = workspace 1 silent, class:^(org.mozilla.firefox)$
windowrulev2 = workspace 3 silent, class:^(discord)$
