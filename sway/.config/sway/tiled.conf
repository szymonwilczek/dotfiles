# Auto-generated by scripts/generate-tiled-rules.sh
# Ref: ~/.config/sway/tiled_apps.list

# ALL new windows open as floating
for_window [app_id=".*"] floating enable
for_window [class=".*"] floating enable

# Dialog windows and popups always floating
for_window [window_type="dialog"] floating enable
for_window [window_role="dialog"] floating enable
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable
for_window [window_role="task_dialog"] floating enable

# Excludes (this one will be tiled)
for_window [app_id="(?i)ghostty"] floating disable
for_window [class="(?i)ghostty"] floating disable
for_window [app_id="(?i)kitty"] floating disable
for_window [class="(?i)kitty"] floating disable
for_window [app_id="(?i)firefox"] floating disable
for_window [class="(?i)firefox"] floating disable
for_window [app_id="(?i)emacs"] floating disable
for_window [class="(?i)emacs"] floating disable
for_window [app_id="(?i)spotify"] floating disable
for_window [class="(?i)spotify"] floating disable
for_window [app_id="(?i)discord"] floating disable
for_window [class="(?i)discord"] floating disable
for_window [app_id="(?i)obs"] floating disable
for_window [class="(?i)obs"] floating disable
