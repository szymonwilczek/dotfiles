[main]
font=Typus Mono 95:size=12,JetBrainsMono Nerd Font:size=12
prompt="❯ "
icon-theme=Adwaita
icons-enabled=yes
show-actions=no
terminal=ghostty

width=30
horizontal-pad=25
vertical-pad=10
inner-pad=10
line-height=24
fields=filename,name,generic,exec
lines=5

[colors]
background=121212f0
selection=2c2c2cff
selection-text=b2b2b2ff
text=6e6e6eff
match=b2b2b2ff
selection-match=b2b2b2ff
prompt=d4d4d4ff
border=707070ff

[border]
width=2
radius=0
