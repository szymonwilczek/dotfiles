[main]
font=Typus Mono:size=12,JetBrainsMono Nerd Font:size=12
prompt="❯ "
icon-theme=Adwaita
icons-enabled=yes
show-actions=no
terminal=ghostty

width=30
horizontal-pad=25
vertical-pad=10
inner-pad=10
line-height=24
fields=filename,name,generic,exec
lines=5

[colors]
background=121212f0
selection=2c2c2cff
selection-text=f5f5f5ff
text=707070ff
match=f5f5f5ff
selection-match=f5f5f5ff
prompt=d4d4d4ff
border=abababff

[border]
width=2
radius=0
