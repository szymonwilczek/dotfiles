# Monitor HDMI Audio Output
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_2d_00.1.hdmi-stereo-extra1" }
    ]
    actions = {
      update-props = {
        # max 48 kHz
        audio.format                     = "S32LE"
        audio.rate                       = 48000
        audio.channels                   = 2
        audio.position                   = "FL,FR"

        # pop/click problem solution
        session.suspend-timeout-seconds  = 0

        # Dithering
        dither.method                    = "wannamaker3"
        dither.noise                     = 0
      }
    }
  }
]
