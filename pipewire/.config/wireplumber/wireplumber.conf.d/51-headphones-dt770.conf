# Beyerdynamic DT770 Pro
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_2f_00.4.analog-stereo" }
    ]
    actions = {
      update-props = {
        audio.format                     = "S32LE"
        audio.rate                       = 48000
        audio.channels                   = 2
        audio.position                   = "FL,FR"

        # pop/click problem solution (after pause)
        session.suspend-timeout-seconds  = 0

        # Dithering in bit conversion (S32->S24 in DAC)
        dither.method                    = "wannamaker3"
        dither.noise                     = 0
      }
    }
  }
]
